<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistyStar Portfolio</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: #121212; color: #e0e0e0; }
        header { background: #1f1f1f; padding: 20px; text-align: center; border-bottom: 2px solid #333; }
        nav button { background: #333; color: #fff; border: none; padding: 10px 20px; margin: 0 5px; cursor: pointer; border-radius: 5px; font-size: 16px; }
        nav button:hover { background: #555; }
        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .section { display: none; }
        .section.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
        h2 { border-bottom: 2px solid #bb86fc; padding-bottom: 10px; color: #bb86fc; }
        .admin-panel { background: #2a2a2a; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px dashed #bb86fc; }
        input, select, textarea { width: 100%; padding: 8px; margin: 5px 0 15px 0; background: #121212; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button.action-btn { background: #bb86fc; color: #000; font-weight: bold; border: none; padding: 10px; cursor: pointer; border-radius: 4px; width: 100%; }
        button.action-btn:hover { background: #985eff; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background: #222; color: #bb86fc; }
    </style>
</head>
<body>

    <header>
        <h1>✨ MistyStar Portfolio ✨</h1>
        <nav>
            <button onclick="switchTab('portfolio')">Portfolio</button>
            <button onclick="switchTab('pricing')">Pricing</button>
            <button onclick="switchTab('queues')">Queue</button>
            <button onclick="toggleAdmin()" style="background:#cf6679; color:#fff;">Admin Mode</button>
        </nav>
    </header>

    <div class="container">
        <!-- Admin Login / Controls -->
        <div id="adminControls" class="admin-panel" style="display:none;">
            <h3>🛠️ Admin Management Panel</h3>
            <div id="loginBox">
                <p>Enter Admin Password to Edit Data:</p>
                <input type="password" id="adminPass" placeholder="Password (1234)">
                <button class="action-btn" onclick="checkAdmin()">Login</button>
            </div>
            <div id="manageBox" style="display:none;">
                <p style="color: #03dac6;">✅ Logged in successfully!</p>
                <h4>Add New Item</h4>
                <select id="targetSheet">
                    <option value="portfolio">Portfolio</option>
                    <option value="pricing">Pricing</option>
                    <option value="queues">Queue</option>
                </select>
                <input type="text" id="addItemTitle" placeholder="Title / Name">
                <input type="text" id="addItemCategory" placeholder="Category / Detail">
                <input type="text" id="addItemImg" placeholder="Image Filename or URL (optional)">
                <textarea id="addItemDesc" placeholder="Description / Price / Status"></textarea>
                <button class="action-btn" onclick="addNewItem()">Add to Google Sheet</button>
            </div>
        </div>

        <!-- Portfolio Section -->
        <div id="portfolio" class="section active">
            <h2>Portfolio</h2>
            <div id="portfolioGrid" class="grid">Loading portfolio...</div>
        </div>

        <!-- Pricing Section -->
        <div id="pricing" class="section">
            <h2>Pricing & Commissions</h2>
            <div id="pricingGrid" class="grid">Loading pricing...</div>
        </div>

        <!-- Queue Section -->
        <div id="queues" class="section">
            <h2>Current Queue Status</h2>
            <div id="queueContainer">Loading queues...</div>
        </div>
    </div>

    <script>
        // Web App URL จาก Google Apps Script ที่คุณเพิ่ง Deploy
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxHfyuJdkaQSCcYWIG4onRsd7IfwCZBvDN-pIt33FyQoFIbrWk8wxBM21dtfhoezHJF-A/exec';

        let appData = { portfolio: [], pricing: [], queues: [] };

        // โหลดข้อมูลทั้งหมดเมื่อเปิดเว็บ
        async function loadData() {
            try {
                let response = await fetch(`${scriptURL}?action=getAll`);
                appData = await response.json();
                renderPortfolio();
                renderPricing();
                renderQueues();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('portfolioGrid').innerHTML = '<p style="color:red;">Failed to load data from Google Sheets.</p>';
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
        }

        function toggleAdmin() {
            let panel = document.getElementById('adminControls');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        function checkAdmin() {
            let pass = document.getElementById('adminPass').value;
            if (pass === '1234') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('manageBox').style.display = 'block';
            } else {
                alert('Wrong password! (Hint: 1234)');
            }
        }

        function renderPortfolio() {
            let grid = document.getElementById('portfolioGrid');
            if (!appData.portfolio.length) { grid.innerHTML = '<p>No portfolio items found.</p>'; return; }
            grid.innerHTML = appData.portfolio.map(item => `
                <div class="card">
                    ${item.img ? `<img src="${item.img}" alt="${item.title}">` : ''}
                    <h3>${item.title || 'Untitled'}</h3>
                    <p><strong>Category:</strong> ${item.category || '-'}</p>
                    <p>${item.desc || ''}</p>
                    ${isAdminLoggedIn() ? `<button onclick="deleteItem('portfolio', '${item.id}')" style="background:#cf6679; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Delete</button>` : ''}
                </div>
            `).join('');
        }

        function renderPricing() {
            let grid = document.getElementById('pricingGrid');
            if (!appData.pricing.length) { grid.innerHTML = '<p>No pricing items found.</p>'; return; }
            grid.innerHTML = appData.pricing.map(item => `
                <div class="card">
                    <h3>${item.title || item.name || 'Service'}</h3>
                    <p style="font-size: 18px; color: #03dac6;"><strong>Price:</strong> ${item.price || item.desc || '-'}</p>
                    <p>${item.details || item.category || ''}</p>
                    ${isAdminLoggedIn() ? `<button onclick="deleteItem('pricing', '${item.id}')" style="background:#cf6679; color:#fff; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Delete</button>` : ''}
                </div>
            `).join('');
        }

        function renderQueues() {
            let container = document.getElementById('queueContainer');
            if (!appData.queues.length) { container.innerHTML = '<p>No queue items found.</p>'; return; }
            let html = `<table><tr><th>Client / Name</th><th>Status</th><th>Detail</th></tr>`;
            appData.queues.forEach(q => {
                html += `<tr><td>${q.title || q.name || '-'}</td><td>${q.category || q.status || '-'}</td><td>${q.desc || ''}</td></tr>`;
            });
            html += `</table>`;
            container.innerHTML = html;
        }

        function isAdminLoggedIn() {
            return document.getElementById('manageBox').style.display === 'block';
        }

        async function addNewItem() {
            let sheet = document.getElementById('targetSheet').value;
            let title = document.getElementById('addItemTitle').value;
            let category = document.getElementById('addItemCategory').value;
            let img = document.getElementById('addItemImg').value;
            let desc = document.getElementById('addItemDesc').value;

            if (!title) { alert('Please enter a title!'); return; }

            let payload = {
                sheet: sheet,
                action: 'add',
                data: { title: title, category: category, img: img, desc: desc }
            };

            try {
                let res = await fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                let result = await res.json();
                if (result.status === 'success') {
                    alert('Added successfully!');
                    document.getElementById('addItemTitle').value = '';
                    document.getElementById('addItemCategory').value = '';
                    document.getElementById('addItemImg').value = '';
                    document.getElementById('addItemDesc').value = '';
                    loadData(); // รีเฟรชข้อมูลใหม่
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (err) {
                console.error(err);
                alert('Failed to connect to backend.');
            }
        }

        async function deleteItem(sheetName, id) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            let payload = { sheet: sheetName, action: 'delete', id: id };
            try {
                let res = await fetch(scriptURL, { method: 'POST', body: JSON.stringify(payload) });
                let result = await res.json();
                if (result.status === 'success') {
                    alert('Deleted successfully!');
                    loadData();
                } else {
                    alert('Error deleting item.');
                }
            } catch (err) {
                console.error(err);
                alert('Failed to connect.');
            }
        }

        // โหลดข้อมูลเมื่อเปิดหน้าเว็บ
        loadData();
    </script>
</body>
</html>
